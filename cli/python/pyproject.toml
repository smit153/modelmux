[project]
name = "modelmux-cli"
version = "0.3.0"
description = "Set up, log in to and run ModelMux: AI coding CLIs as an OpenAI-compatible API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Deliberately no runtime dependencies: this tool drives Docker on the user's
# machine, so it stays small and easy to audit.
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/smit153/modelmux"
Source = "https://github.com/smit153/modelmux"
Issues = "https://github.com/smit153/modelmux/issues"

[project.scripts]
modelmux = "modelmux_cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmux_cli"]

# The language-neutral data in /shared is bundled by hatch_build.py, both
# from the repository and when a wheel is built from the sdist.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "PL", "TID", "PT", "C4", "RET",
]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.pylint]
max-returns = 10

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Run commands only via modelmux_cli.docker."
"os.system".msg = "No shells. Run commands only via modelmux_cli.docker."
"os.popen".msg = "No shells. Run commands only via modelmux_cli.docker."
"pty".msg = "Run commands only via modelmux_cli.docker."

[tool.ruff.lint.per-file-ignores]
"src/modelmux_cli/docker.py" = ["TID251", "S603", "S606"]
"tests/**" = ["S101", "S105", "S106", "S108", "TID251", "S603", "S607", "PLR0917"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["modelmux_cli"]
branch = true
