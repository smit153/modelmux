[project]
name = "modelmux"
version = "0.1.0"
description = "Expose AI coding CLIs as a secure, OpenAI-compatible Chat Completions API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jsonschema>=4.23",
    "prometheus-client>=0.20",
    "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/smit153/modelmux"
Source = "https://github.com/smit153/modelmux"
Issues = "https://github.com/smit153/modelmux/issues"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "openai>=1.40",
    "types-jsonschema>=4.23",
    "langchain-openai>=0.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmux"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "PL", "TID", "ASYNC", "PT", "C4", "RET",
]
ignore = [
    "PLR0913",  # driver/runtime signatures legitimately take many args
    "PLR2004",  # magic values are fine in HTTP status comparisons
]

[tool.ruff.lint.pylint]
max-returns = 10  # event parsers dispatch with early returns

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Spawn processes only via modelmux.runtime.runner."
"os.system".msg = "No shells. Spawn processes only via modelmux.runtime.runner."
"os.popen".msg = "No shells. Spawn processes only via modelmux.runtime.runner."
"os.spawnl".msg = "Spawn processes only via modelmux.runtime.runner."
"os.spawnv".msg = "Spawn processes only via modelmux.runtime.runner."
"os.execv".msg = "Spawn processes only via modelmux.runtime.runner."
"os.execvp".msg = "Spawn processes only via modelmux.runtime.runner."
"asyncio.create_subprocess_exec".msg = "Spawn processes only via modelmux.runtime.runner."
"asyncio.create_subprocess_shell".msg = "No shells anywhere."

[tool.ruff.lint.per-file-ignores]
"src/modelmux/runtime/runner.py" = ["TID251"]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "TID251", "S603", "S607", "ASYNC230", "ASYNC240", "ASYNC251", "ASYNC110", "PLR0917"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: runs a real CLI against a real provider (skipped by default)",
]

[tool.coverage.run]
source = ["modelmux"]
branch = true
